# Locked model configuration for the Food RAG system.
#
# All model ids, endpoints and embedding dims live here (never hardcoded in
# notebooks/scripts). API keys are read from the environment / .env by the
# names given in `providers[*].api_key_env` — keys never appear in this file.
#
# Providers expose OpenAI-compatible endpoints, so LiteLLM is pointed at
# `api_base` with the model id prefixed `openai/` (matching the original setup).

providers:
  deepinfra:
    api_base: "https://api.deepinfra.com/v1/openai"
    api_key_env: DEEPINFRA_API_KEY
  openrouter:
    api_base: "https://openrouter.ai/api/v1"
    api_key_env: OPENROUTER_API_KEY
  openai:             # OpenAI direct (api.openai.com), not a reseller
    api_base: "https://api.openai.com/v1"
    api_key_env: OPENAI_API_KEY
  nvidia:             # NVIDIA NIM (hosts e.g. snowflake/arctic-embed-l, NV-Embed)
    api_base: "https://integrate.api.nvidia.com/v1"
    api_key_env: NVIDIA_KEY
  pagoda:             # Ollama on the lab server (free, slow; needs lab VPN)
    kind: ollama
    api_base_env: OLLAMA_BASE_URL
    api_key_env: OLLAMA_API_KEY
  huggingface:        # local embeddings via sentence-transformers (no api_base)
    local: true
    api_key_env: HF_TOKEN

# Main generation LLM (the agent / generator).
llm:
  provider: deepinfra
  model: "meta-llama/Llama-3.3-70B-Instruct"
  temperature: 0.1
  max_retries: 5
  request_timeout: 120

# Meal-type annotation LLM. This is the huge (~270k recipe) but free pass, run
# on Pagoda (Ollama, Llama 3.3 70B) -- slow is fine. See foodrag.llm.ollama_pagoda.
annotation:
  provider: pagoda
  model: "llama3.3:70b"
  temperature: 0.1
  num_predict: -1
  keep_alive: "30m"
  max_attempts: 12
  read_timeout: 600

# Active embedding model (the one the vector store / retrievers use).
# Locked to the winner of `bench-embeddings` (WS5); BGE-M3 is the default
# because it matches the system's hybrid (dense+sparse) design at dim 1024.
embedding:
  provider: deepinfra
  model: "BAAI/bge-m3"
  dim: 1024
  chunk_size: 512

# Candidates compared by `bench-embeddings`. Each model is embedded into its
# OWN pgvector table sized to its dim (dims differ, so there is no shared
# schema). Verified live on DeepInfra: bge-m3=1024, qwen3-4b=2560.
# NOTE: the original's Snowflake/snowflake-arctic-embed-l is unavailable on our
# providers (404 on DeepInfra; deprecated on NVIDIA NIM -> 403), so it is
# dropped. bge-large-en-v1.5 stands in as a 1024d alternative. If continuity
# with the original is needed, arctic-embed-v2.0 could be added if a provider
# hosts it.
embedding_candidates:
  - name: bge-m3
    provider: deepinfra
    model: "BAAI/bge-m3"
    dim: 1024
  - name: qwen3-4b
    provider: deepinfra
    model: "Qwen/Qwen3-Embedding-4B"
    dim: 2560
  - name: bge-large-en
    provider: deepinfra
    model: "BAAI/bge-large-en-v1.5"
    dim: 1024
  - name: mpnet-base
    provider: huggingface
    model: "sentence-transformers/all-mpnet-base-v2"
    dim: 768

# Text-to-Pandas retriever backbones (EXP-ret-tight).
#
# The code-generation LLM behind `ret_text2pandas@<name>`. Both backbones are
# run in ONE session into ONE aggregate so the comparison is within-experiment
# (the Jun/Jul 2026 artefacts had llama70b in eval_results_llama/ and gpt4o-mini
# in eval_results/, produced a day apart — see specs/checks-T-Q-H-findings.md H.2).
#
# NOTE on provenance: the original `ret_text2pandas@gpt4o-mini` run left no trace
# in data/logs/llm_calls-*.jsonl and models.yml had no OpenAI provider at the
# time, so the model behind that config_id is unverifiable. The `openai` provider
# below is a deliberate re-declaration, not a reconstruction.
retriever_backbones:
  - name: llama70b
    provider: deepinfra
    model: "meta-llama/Llama-3.3-70B-Instruct"
    temperature: 0.1
    max_retries: 5
    request_timeout: 120
  # Routed via OpenRouter rather than OpenAI direct. Both were verified working
  # on 2026-08-23; OpenRouter is the more likely match for the original run,
  # since models.yml had no `openai` provider when those artefacts were made.
  #
  # PINNED, deliberately: `openai/gpt-4o-mini` is a floating alias that OpenAI
  # can repoint at any time, which would make this run as unreproducible as the
  # one it replaces. The dated id is the whole point.
  - name: gpt4o-mini
    provider: openrouter
    model: "openai/gpt-4o-mini-2024-07-18"
    temperature: 0.1
    max_retries: 5
    request_timeout: 120

# LLM-as-judge models. MUST differ from `llm.model` (enforced in code).
# Used for QA question-rating and answer evaluation; compared head-to-head.
judges:
  default: deepseek-v3
  models:
    - name: deepseek-v3
      provider: deepinfra
      model: "deepseek-ai/DeepSeek-V3"
    - name: gemma
      provider: openrouter
      # NOTE: confirm the exact id against OpenRouter's live catalog; the user
      # referenced a ~27-31B Gemma. Update here if it differs.
      model: "google/gemma-3-27b-it"

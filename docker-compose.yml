# Backing stores for the Food RAG system.
#
#   docker compose up -d                    # Postgres + Neo4j (core path)
#   docker compose --profile nebula up -d   # also start NebulaGraph (legacy)
#   docker compose down                     # stop; add -v to wipe data
#
# Credentials come from .env (see .env.example); defaults below match
# foodrag.config.stores so it works without a .env too.

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: foodrag-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-rag_postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5.26-community
    container_name: foodrag-neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-neo4jfoodrag}
      # Allow APOC / LOAD CSV used by the KG import.
      NEO4J_apoc_import_file_enabled: "true"
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"   # HTTP browser
      - "${NEO4J_BOLT_PORT:-7687}:7687"   # Bolt
    volumes:
      - neo4jdata:/data
      - neo4jimport:/var/lib/neo4j/import
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  # --- NebulaGraph (legacy / optional) -- `--profile nebula` ---------------
  # Minimal single-node layout (metad + storaged + graphd). Only needed for the
  # text-to-Cypher-on-Nebula retriever in the original evaluation.
  nebula-metad:
    image: vesoft/nebula-metad:v3.8.0
    profiles: ["nebula"]
    container_name: foodrag-nebula-metad
    command:
      - --meta_server_addrs=nebula-metad:9559
      - --local_ip=nebula-metad
      - --ws_ip=nebula-metad
      - --port=9559
      - --data_path=/data/meta
    volumes:
      - nebula-meta:/data/meta
    healthcheck:
      test: ["CMD", "sh", "-c", "curl -sf http://nebula-metad:19559/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  nebula-storaged:
    image: vesoft/nebula-storaged:v3.8.0
    profiles: ["nebula"]
    container_name: foodrag-nebula-storaged
    depends_on: [nebula-metad]
    command:
      - --meta_server_addrs=nebula-metad:9559
      - --local_ip=nebula-storaged
      - --ws_ip=nebula-storaged
      - --port=9779
      - --data_path=/data/storage
    volumes:
      - nebula-storage:/data/storage

  nebula-graphd:
    image: vesoft/nebula-graphd:v3.8.0
    profiles: ["nebula"]
    container_name: foodrag-nebula-graphd
    depends_on: [nebula-metad, nebula-storaged]
    command:
      - --meta_server_addrs=nebula-metad:9559
      - --local_ip=nebula-graphd
      - --ws_ip=nebula-graphd
      - --port=9669
    ports:
      - "${NEBULA_PORT:-9669}:9669"

volumes:
  pgdata:
  neo4jdata:
  neo4jimport:
  nebula-meta:
  nebula-storage:
